# Local development only. Hosted Auth settings are configured in the dashboard.
project_id = "fixhub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match this to your hosted project's PostgreSQL major version before local testing.
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/callback?flow=recovery",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback?flow=recovery",
  "com.fixhub.app://auth/callback",
  "com.fixhub.app://auth/callback?flow=recovery"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
